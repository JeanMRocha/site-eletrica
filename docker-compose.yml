services:
  db:
    image: postgres:16-alpine
    container_name: eletrica-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eletrica_pass}
      POSTGRES_DB: ${DB_NAME:-eletrica_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eletrica_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: eletrica-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-eletrica_pass}@db:5432/${DB_NAME:-eletrica_db}?sslmode=disable
      HTTP_ADDR: :8080
      AUTH_DEMO_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      AUTH_DEMO_NAME: ${ADMIN_NAME:-Admin}
      AUTH_DEMO_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: eletrica-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
